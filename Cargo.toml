[workspace]
exclude = []
resolver = "2"
members = ["flymoon", "lib/*"]
# members = ["flymoon",  "latex-image", "lib/*"]

[workspace.package]
license = "MIT"
edition = "2024"
version = "0.1.0"
readme = "README.md"
authors = ["Heng30 <rongheng30@gmail.com>"]
keywords = ["Rust", "GUI", "Slint", "Chatbot"]
homepage = "https://github.com/Heng30/flymoon"
repository = "https://github.com/Heng30/flymoon"
description = "It's a LLM chatbot, compatible with OpenAI's API."

[profile.dev]
lto = false
debug = false
opt-level = 0
incremental = true

[profile.release]
lto = true
strip = true
debug = false
panic = "abort"
opt-level = "s"
codegen-units = 1
incremental = true

[workspace.dependencies]
log = "0.4"
hex = "0.4"
aes = "0.8"
syn = "2.0"
sqlx = "0.8"
rand = "0.9"
toml = "0.9"
duct = "1.0"
uuid = "1.16"
serde = "1.0"
quote = "1.0"
bytes = "1.10"
tokio = "1.44"
regex = "1.11"
slint = "1.14"
slint-build = "1.14"
image = "0.25"
cfg-if = "1.0"
anyhow = "1.0"
chrono = "0.4"
qrcode = "0.14"
reqwest = "0.13"
clipboard = "0.5"
once_cell = "1.21"
serde_json = "1.0"
webbrowser = "1.0"
derivative = "2.2"
serde_with = "3.12"
env_logger = "0.11"
proc-macro2 = "1.0"
crypto-hash = "0.3"
tokio-stream = "0.1"
display-info = "0.5"
platform-dirs = "0.3"
embed-resource = "3.0"
pulldown-cmark = "0.13"
paste = "1.0"

# latex-image dependencies
clap = "4.5"
resvg = "0.45.1"
tiny-skia = "0.11"
mathjax_svg = "3.2"

bot = { path = "lib/bot" }
cutil = { path = "lib/cutil" }
sqldb = { path = "lib/sqldb" }
pmacro = { path = "lib/pmacro" }
dummy_markdown = { path = "lib/dummy_markdown" }
